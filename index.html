
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123247">
<title>Pahunch Ledger</title>

<style>
:root {
  --navy:#123247;
  --teal:#13877e;
  --bg:#f3f6f7;
  --ink:#203542;
  --muted:#6e808a;
  --line:#dfe7e9;
  --white:#fff;
  --green:#23835f;
  --red:#b84c52;
  --gold:#b77a25;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
  font-size:14px;
}

button,input,select,textarea {
  font:inherit;
}

button { cursor:pointer; }

.top {
  background:var(--navy);
  color:white;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

.brand {
  font-size:21px;
  font-weight:800;
}

.brand small {
  display:block;
  font-size:11px;
  font-weight:normal;
  margin-top:5px;
  color:#c4d4dc;
}

.top-controls {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.top select,.top button {
  padding:9px;
  border-radius:8px;
  border:1px solid #ffffff55;
  background:#ffffff12;
  color:white;
}

.top option { color:#123247; }

.rolebar {
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  padding:14px 20px;
  background:white;
  border-bottom:1px solid var(--line);
}

.rolebar span {
  font-size:11px;
  font-weight:bold;
  color:var(--muted);
}

.role {
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#f6f8f9;
  color:var(--ink);
  font-weight:bold;
}

.role.active {
  background:var(--teal);
  color:white;
  border-color:var(--teal);
}

main {
  max-width:1200px;
  margin:auto;
  padding:22px;
}

.banner {
  padding:13px;
  border-radius:10px;
  background:#fff7e9;
  border:1px solid #f0dfbb;
  color:#76551e;
  font-size:12px;
  line-height:1.6;
  margin-bottom:18px;
}

.welcome {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:12px;
  margin:8px 0 18px;
}

.welcome h1 {
  margin:0 0 7px;
  font-size:25px;
}

.welcome p {
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.card {
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:17px;
  margin-bottom:14px;
}

.card h2 {
  margin:0 0 13px;
  font-size:17px;
}

.card h3 {
  margin:0 0 10px;
  font-size:14px;
}

.field {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:13px;
}

.field label {
  font-size:12px;
  font-weight:bold;
  color:#526771;
}

.field input,
.field select,
.field textarea {
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
  color:var(--ink);
}

.field textarea {
  min-height:85px;
  resize:vertical;
}

.row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn {
  border:0;
  border-radius:8px;
  padding:10px 14px;
  background:var(--teal);
  color:white;
  font-size:12px;
  font-weight:bold;
}

.btn.secondary {
  background:#eaf0f2;
  color:var(--ink);
}

.btn.dark { background:var(--navy); }

.btn.danger {
  background:#fff0f0;
  color:var(--red);
}

.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.muted {
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.tiny {
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.tag {
  display:inline-block;
  padding:5px 9px;
  border-radius:30px;
  background:#edf2f3;
  font-size:10px;
  font-weight:bold;
}

.tag.pending {
  background:#fff2d9;
  color:#91651d;
}

.tag.verified {
  background:#e6f3ed;
  color:#20724f;
}

.tag.rejected {
  background:#ffeded;
  color:#a53d45;
}

.tag.progress {
  background:#eaf2ff;
  color:#3769a0;
}

.list {
  display:grid;
  gap:10px;
}

.item {
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px;
  background:white;
}

.item h3 {
  margin:0 0 6px;
  font-size:13px;
}

.item p {
  margin:5px 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.item-head {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:10px;
}

.divider {
  border:0;
  border-top:1px solid var(--line);
  margin:15px 0;
}

.checklist {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.check {
  display:flex;
  align-items:start;
  gap:8px;
  padding:10px;
  background:#f7f9fa;
  border-radius:8px;
  font-size:12px;
}

.check input { margin-top:2px; }

.hidden { display:none !important; }

.table-wrap { overflow:auto; }

table {
  width:100%;
  border-collapse:collapse;
  min-width:560px;
}

th,td {
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:11px;
  vertical-align:top;
}

th {
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
}

.note {
  background:#edf7f5;
  border:1px solid #d7ebe7;
  border-radius:9px;
  padding:11px;
  font-size:11px;
  line-height:1.6;
  margin:12px 0;
}

.toast {
  display:none;
  position:fixed;
  bottom:18px;
  right:18px;
  z-index:20;
  padding:12px 16px;
  border-radius:9px;
  background:var(--navy);
  color:white;
}

.toast.show { display:block; }

footer {
  text-align:center;
  padding:20px;
  color:#8a999f;
  font-size:10px;
}

@media(max-width:700px) {
  main { padding:14px; }
  .grid,.row { grid-template-columns:1fr; }
  .checklist { grid-template-columns:1fr; }
  .welcome { display:block; }
  .top { padding:13px; }
}
</style>
</head>

<body>
<div class="app">

<header class="top">
  <div class="brand">
    Pahunch Ledger
    <small data-i18n="tagline">
      Community needs → verification → assistance → follow-up
    </small>
  </div>

  <div class="top-controls">
    <label for="language" data-i18n="language">Language</label>

    <select id="language">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
    </select>

    <button id="resetDemo" type="button" data-i18n="reset">
      Reset demo
    </button>
  </div>
</header>

<nav class="rolebar">
  <span data-i18n="switchPortal">SWITCH PORTAL:</span>

  <button class="role active" data-role="reporter">
    Reporter
  </button>

  <button class="role" data-role="verifier">
    Verifier
  </button>

  <button class="role" data-role="coordinator">
    Coordinator
  </button>
</nav>

<main>

<div class="banner" data-i18n="demoWarning">
  DEMO MODE — These are demonstration portals. Sample data and
  contact details are fictional. This is not an emergency service.
</div>

<section id="reporterPortal"></section>

<section id="verifierPortal" class="hidden"></section>

<section id="coordinatorPortal" class="hidden"></section>

</main>

<footer>
  Pahunch Ledger · Community assistance coordination prototype
</footer>

</div>

<div id="toast" class="toast" role="status"></div>

let lang = "en";
let currentRole = "reporter";
let reports = JSON.parse(localStorage.getItem("pl_reports") || "[]");
let tasks = JSON.parse(localStorage.getItem("pl_tasks") || "[]");
let historyLog = JSON.parse(localStorage.getItem("pl_history") || "[]");

const $ = id => document.getElementById(id);
const t = key => translations[lang][key] || translations.en[key] || key;

function saveData(){
 localStorage.setItem("pl_reports", JSON.stringify(reports));
 localStorage.setItem("pl_tasks", JSON.stringify(tasks));
 localStorage.setItem("pl_history", JSON.stringify(historyLog));
}

function logActivity(message, reportId=""){
 historyLog.unshift({time:new Date().toLocaleString(),message,reportId});
 saveData();
}

function toast(message){
 const el=$("toast");
 if(el){el.textContent=message;el.classList.add("show");
 setTimeout(()=>el.classList.remove("show"),2600);}
}

function makeId(){
 return "PL-" + Date.now().toString(36).toUpperCase();
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g, c =>
 ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function setLanguage(value){
 lang=value;
 document.documentElement.lang=value;
 document.querySelectorAll("[data-i18n]").forEach(el=>{
  el.textContent=t(el.dataset.i18n);
 });
 renderApp();
}
</script>

<script>
function renderReporter(){
 const host=$("reporterPortal");
 host.innerHTML=`
 <h2>${t("reporter")}</h2>
 <p>${t("privacy")}</p>
 <p>${t("notEmergency")}</p>
 <form id="reportForm">
  <label>${t("category")}
   <select id="category">
    <option value="disaster">${t("disaster")}</option>
    <option value="general">${t("general")}</option>
   </select>
  </label>
  <label>${t("area")} *
   <input id="area" required maxlength="100">
  </label>
  <label>${t("ward")}
   <input id="ward" maxlength="100">
  </label>
  <label>${t("urgency")}
   <select id="urgency">
    <option value="low">${t("low")}</option>
    <option value="medium">${t("medium")}</option>
    <option value="high">${t("high")}</option>
   </select>
  </label>
  <label>${t("affected")} *
   <input id="affected" type="number" min="0" max="1000000" required>
  </label>
  <h3>${t("disasterNote")}</h3>
  <div class="grid">
   <label>${t("children")}<input id="children" type="number" min="0"></label>
   <label>${t("older")}<input id="older" type="number" min="0"></label>
   <label>${t("pregnant")}<input id="pregnant" type="number" min="0"></label>
   <label>${t("disability")}<input id="disability" type="number" min="0"></label>
  </div>
  <h3>Reported condition estimates</h3>
  <div class="grid">
   <label>${t("deceased")}<input id="deceased" type="number" min="0"></label>
   <label>${t("urgentMedical")}<input id="urgentMedical" type="number" min="0"></label>
   <label>${t("minor")}<input id="minor" type="number" min="0"></label>
   <label>${t("unknown")}<input id="unknown" type="number" min="0"></label>
  </div>
  <label>${t("description")} *
   <textarea id="description" required maxlength="2000" rows="5"></textarea>
  </label>
  <button type="button" id="voiceBtn">${t("startVoice")}</button>
  <label>${t("files")}
   <input id="evidenceFiles" type="file" multiple accept="image/*,video/*,.pdf">
  </label>
  <p id="fileNames"></p>
  <label>${t("location")}</label>
  <button type="button" id="locationBtn">${t("getLocation")}</button>
  <p id="locationText">Not shared</p>
  <button type="submit">${t("send")}</button>
 </form>
 <section id="myReports">
  <h3>${t("tracking")}</h3>
  <div id="reportList"></div>
 </section>`;

 $("evidenceFiles").addEventListener("change",e=>{
  $("fileNames").textContent=[...e.target.files]
   .map(f=>f.name+" ("+Math.round(f.size/1024)+" KB)").join(", ");
 });
 $("locationBtn").onclick=getApproxLocation;
 $("voiceBtn").onclick=toggleVoice;
 $("reportForm").onsubmit=submitReport;
 renderMyReports();
}

let locationSnapshot="";
function getApproxLocation(){
 if(!navigator.geolocation){toast("Location is not supported.");return;}
 $("locationText").textContent="Requesting permission…";
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=Math.round(pos.coords.latitude*100)/100;
  const lon=Math.round(pos.coords.longitude*100)/100;
  locationSnapshot=lat+", "+lon;
  $("locationText").textContent="Approximate coordinates: "+locationSnapshot;
 },()=>{
  $("locationText").textContent="Location permission not granted.";
 },{enableHighAccuracy:false,timeout:10000,maximumAge:60000});
}

let recognition=null;
function toggleVoice(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){toast("Voice typing is not supported in this browser.");return;}
 if(recognition){recognition.stop();recognition=null;return;}
 recognition=new Speech();
 recognition.lang=lang==="hi"?"hi-IN":lang==="pa"?"pa-IN":"en-IN";
 recognition.interimResults=false;
 recognition.onresult=e=>{
  $("description").value+=" "+e.results[0][0].transcript;
 };
 recognition.onerror=()=>toast("Voice input unavailable.");
 recognition.onend=()=>{recognition=null;};
 recognition.start();
}

function submitReport(e){
 e.preventDefault();
 const n=id=>Number($(id).value||0);
 const affected=n("affected");
 const conditions=n("deceased")+n("urgentMedical")+n("minor")+n("unknown");
 if(conditions>affected){
  toast("Condition estimates cannot exceed affected people.");
  return;
 }
 const report={
  id:makeId(),category:$("category").value,
  area:$("area").value.trim(),ward:$("ward").value.trim(),
  urgency:$("urgency").value,affected,
  demographics:{children:n("children"),older:n("older"),
   pregnant:n("pregnant"),disability:n("disability")},
  conditions:{deceased:n("deceased"),urgentMedical:n("urgentMedical"),
   minor:n("minor"),unknown:n("unknown")},
  description:$("description").value.trim(),
  location:locationSnapshot,
  files:[...$("evidenceFiles").files].map(f=>f.name),
  status:"pending",created:new Date().toISOString(),
  review:null,taskId:null
 };
 if(!report.area||!report.description){toast(t("required"));return;}
 reports.unshift(report);
 saveData();
 logActivity("New report submitted",report.id);
 $("reportForm").reset();
 locationSnapshot="";
 renderMyReports();
 toast(t("success"));
}

function renderMyReports(){
 const el=$("reportList");
 if(!el)return;
 el.innerHTML=reports.map(r=>`
  <article class="item">
   <strong>${escapeHTML(r.id)}</strong>
   <p>${escapeHTML(r.area)} — ${escapeHTML(r.category)}</p>
   <p>${escapeHTML(r.status)}</p>
  </article>`).join("")||`<p>${t("noReports")}</p>`;
}
</script>

<script>
function renderVerifier(){
 const host=$("verifierPortal");
 host.innerHTML=`
 <h2>${t("verifier")}</h2>
 <p>Reports require human review. Submission or photographs alone do not establish verification.</p>
 <div id="verificationQueue"></div>`;
 renderVerificationQueue();
}

function renderVerificationQueue(){
 const el=$("verificationQueue");
 if(!el)return;
 const queue=reports.filter(r=>r.status==="pending"||
  r.status==="clarification");
 el.innerHTML=queue.map(r=>`
 <article class="item">
  <h3>${escapeHTML(r.id)}</h3>
  <p><b>${t("area")}:</b> ${escapeHTML(r.area)}</p>
  <p><b>${t("category")}:</b> ${escapeHTML(r.category)}</p>
  <p><b>${t("urgency")}:</b> ${escapeHTML(r.urgency)}</p>
  <p><b>${t("affected")}:</b> ${r.affected}</p>
  <p>${escapeHTML(r.description)}</p>
  <p><b>${t("status")}:</b> ${escapeHTML(r.status)}</p>
  <p><b>${t("related")}:</b> ${escapeHTML(findDuplicates(r).map(x=>x.id).join(", ")||"None suggested")}</p>
  <form class="reviewForm" data-id="${r.id}">
   <h4>${t("checklist")}</h4>
   <label><input type="checkbox" name="areaCheck" required> ${t("areaCheck")}</label>
   <label><input type="checkbox" name="dateCheck" required> ${t("dateCheck")}</label>
   <label><input type="checkbox" name="duplicateCheck" required> ${t("duplicateCheck")}</label>
   <label><input type="checkbox" name="evidenceCheck" required> ${t("evidenceCheck")}</label>
   <label><input type="checkbox" name="uncertaintyCheck" required> ${t("uncertaintyCheck")}</label>
   <label>${t("source")}
    <select name="source" required>
     <option value="">${t("choose")}</option>
     <option>Official notice / agency</option>
     <option>Authorised local representative</option>
     <option>Recognised NGO</option>
     <option>Field team / site visit</option>
     <option>Reporter follow-up</option>
     <option>Other documented source</option>
    </select>
   </label>
   <label>${t("sourceName")}<input name="sourceName" required></label>
   <label>${t("evidence")}
    <select name="evidence" required>
     <option value="">${t("choose")}</option>
     <option>Official document</option>
     <option>Field observation</option>
     <option>Authorised confirmation</option>
     <option>Reporter statement</option>
     <option>Other</option>
    </select>
   </label>
   <label>${t("evidenceNotes")}<textarea name="evidenceNotes" required></textarea></label>
   <label>${t("related")}<input name="related"></label>
   <label>${t("reason")}<textarea name="reason" required></textarea></label>
   <button type="submit" name="decision" value="verified">${t("approve")}</button>
   <button type="submit" name="decision" value="rejected">${t("reject")}</button>
   <button type="submit" name="decision" value="clarification">${t("requestInfo")}</button>
  </form>
 </article>`).join("")||`<p>${t("noReports")}</p>`;

 document.querySelectorAll(".reviewForm").forEach(form=>{
  form.onsubmit=e=>{
   e.preventDefault();
   const data=new FormData(form);
   const report=reports.find(r=>r.id===form.dataset.id);
   if(!report)return;
   const decision=e.submitter.value;
   const checks=["areaCheck","dateCheck","duplicateCheck","evidenceCheck","uncertaintyCheck"];
   if(decision==="verified"&&!checks.every(k=>data.get(k)==="on")){
    toast("Complete every review check before verification.");return;
   }
   if(!data.get("sourceName")||!data.get("evidenceNotes")||!data.get("reason")){
    toast(t("required"));return;
   }
   report.status=decision;
   report.review={
    decision,source:data.get("source"),sourceName:data.get("sourceName"),
    evidence:data.get("evidence"),evidenceNotes:data.get("evidenceNotes"),
    related:data.get("related"),reason:data.get("reason"),
    checks:Object.fromEntries(checks.map(k=>[k,data.get(k)==="on"])),
    reviewedAt:new Date().toISOString()
   };
   logActivity("Verifier decision: "+decision,report.id);
   saveData();
   renderVerificationQueue();
   toast(t("success"));
  };
 });
}

function findDuplicates(report){
 return reports.filter(r=>r.id!==report.id&&
  r.area.toLowerCase()===report.area.toLowerCase()&&
  r.category===report.category);
}
</script>

   <label>${t("team")}<input name="team" required value="${escapeHTML(org.team)}"></label>
   <label>${t("contact")}<input name="contact" required value="${escapeHTML(org.contact)}"></label>
   <label>${t("phone")}<input name="phone" required value="${escapeHTML(org.phone)}"></label>
   <label>${t("assistance")}<input name="assistance" required></label>
   <label>${t("quantity")}<input name="quantity" required></label>
   <label>${t("resource")}<input name="resource" required></label>
   <label>${t("plannedDate")}<input name="plannedDate" type="date" required></label>
   <label>${t("destination")}<input name="destination" required value="${escapeHTML(report.area)}"></label>
   <label>${t("notes")}<textarea name="notes"></textarea></label>
   <button type="submit">${t("createTask")}</button>
  </form>
 </section>`);
 $("taskForm").onsubmit=e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  const task={id:makeId(),reportId,...d,status:"planned",
   dispatchRef:"",deliverySource:"",created:new Date().toISOString(),
   outcome:"",followSource:""};
  tasks.unshift(task);
  report.taskId=task.id;
  saveData();
  logActivity("Assistance task created",report.id);
  renderCoordinator();
  toast(t("success"));
 };
}
</script>

<script>
function showTaskUpdate(taskId){
 const task=tasks.find(x=>x.id===taskId);
 if(!task)return;
 $("coordinatorPortal").insertAdjacentHTML("beforeend",`
 <section class="item" id="taskUpdate">
  <h3>Update ${escapeHTML(task.id)}</h3>
  <form id="updateForm">
   <label>${t("status")}
    <select name="status">
     <option value="planned">Planned</option>
     <option value="assigned">Assigned</option>
     <option value="dispatched">Dispatched</option>
     <option value="delivered">Delivered</option>
     <option value="partial">Partially delivered</option>
     <option value="unable">Unable to deliver</option>
    </select>
   </label>
   <label>${t("dispatchRef")}<input name="dispatchRef" value="${escapeHTML(task.dispatchRef)}"></label>
   <label>${t("deliverySource")}<input name="deliverySource" value="${escapeHTML(task.deliverySource)}"></label>
   <label>${t("notes")}<textarea name="notes">${escapeHTML(task.notes)}</textarea></label>
   <button type="submit">${t("update")}</button>
  </form>
 </section>`);
 $("updateForm").onsubmit=e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  if(d.status==="dispatched"&&!d.dispatchRef.trim()){
   toast("A dispatch or handover reference is required.");return;
  }
  if(d.status==="delivered"&&(!task.dispatchRef&&!d.dispatchRef.trim())){
   toast("Record dispatch before confirming delivery.");return;
  }
  if(d.status==="delivered"&&!d.deliverySource.trim()){
   toast("A delivery confirmation source is required.");return;
  }
  task.status=d.status;
  task.dispatchRef=d.dispatchRef.trim();
  task.deliverySource=d.deliverySource.trim();
  task.notes=d.notes;
  task.updated=new Date().toISOString();
  saveData();
  logActivity("Task status updated: "+d.status,task.reportId);
  renderCoordinator();
  toast(t("success"));
 };
}

function showFollowUp(taskId){
 const task=tasks.find(x=>x.id===taskId);
 if(!task)return;
 $("coordinatorPortal").insertAdjacentHTML("beforeend",`
 <section class="item" id="followFormBox">
  <h3>${t("outcome")} — ${escapeHTML(task.id)}</h3>
  <form id="followForm">
   <label>${t("outcome")}
    <select name="outcome" required>
     <option value="addressed">${t("addressed")}</option>
     <option value="partly">${t("partly")}</option>
     <option value="unresolved">${t("unresolved")}</option>
    </select>
   </label>
   <label>${t("followSource")}<input name="followSource" required></label>
   <label>${t("notes")}<textarea name="followNotes" required></textarea></label>
   <button type="submit">${t("saveFollow")}</button>
  </form>
 </section>`);
 $("followForm").onsubmit=e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  task.outcome=d.outcome;
  task.followSource=d.followSource;
  task.followNotes=d.followNotes;
  task.followedUpAt=new Date().toISOString();
  saveData();
  logActivity("Follow-up recorded: "+d.outcome,task.reportId);
  renderCoordinator();
  toast(t("success"));
 };
}
</script>

<script>
function showRole(role){
 currentRole=role;
 document.querySelectorAll(".role").forEach(btn=>{
  btn.classList.toggle("active",btn.dataset.role===role);
 });
 ["reporter","verifier","coordinator"].forEach(name=>{
  const section=$(name+"Portal");
  if(section)section.hidden=name!==role;
 });
 if(role==="reporter")renderReporter();
 if(role==="verifier")renderVerifier();
 if(role==="coordinator")renderCoordinator();
}

function renderApp(){
 $("language").value=lang;
 document.querySelectorAll("[data-i18n]").forEach(el=>{
  el.textContent=t(el.dataset.i18n);
 });
 showRole(currentRole);
}

document.querySelectorAll(".role").forEach(btn=>{
 btn.addEventListener("click",()=>showRole(btn.dataset.role));
});

$("language").addEventListener("change",e=>setLanguage(e.target.value));

function exportReports(){
 const data={
  exportedAt:new Date().toISOString(),
  reports,tasks,historyLog
 };
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="pahunch-ledger-demo-data.json";
 a.click();
 URL.revokeObjectURL(url);
}

function exportCSV(){
 const headers=["ID","Area","Category","Urgency","Affected","Status","Description"];
 const rows=reports.map(r=>[
  r.id,r.area,r.category,r.urgency,r.affected,r.status,r.description
 ]);
 const csv=[headers,...rows].map(row=>
  row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")
 ).join("\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="pahunch-ledger-reports.csv";a.click();
 URL.revokeObjectURL(url);
}

function addExportButtons(){
 const footer=document.querySelector("footer");
 if(!footer)return;
 footer.innerHTML=`
  <button type="button" id="exportJSON">Export JSON backup</button>
  <button type="button" id="exportCSV">Export reports CSV</button>
  <p>Demo data is stored only in this browser. It does not sync to other devices.</p>`;
 $("exportJSON").onclick=exportReports;
 $("exportCSV").onclick=exportCSV;
}

addExportButtons();
</script>

<script>
$("resetDemo").addEventListener("click",()=>{
 const ok=confirm("Reset all Pahunch Ledger demo records in this browser?");
 if(!ok)return;
 reports=[];
 tasks=[];
 historyLog=[];
 localStorage.removeItem("pl_reports");
 localStorage.removeItem("pl_tasks");
 localStorage.removeItem("pl_history");
 seedDemo();
 logActivity("Demo data reset");
 renderApp();
 toast("Demo reset successfully.");
});

function initialise(){
 // Restore saved demo data and provide one sample verified report.
 if(!reports.some(r=>r.demo))seedDemo();

 // Make sure all three portals are independently accessible.
 document.querySelectorAll(".role").forEach(btn=>{
  btn.setAttribute("type","button");
 });

 setLanguage($("language").value||"en");
 addExportButtons();
}

initialise();
</script>
</body>
</html>
