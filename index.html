<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123c35">
<title>Pahunch Ledger | Community Response Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{--green:#123c35;--green2:#1d6657;--mint:#e8f3ed;--paper:#f6f8f5;--ink:#182b27;--muted:#71817b;--line:#e1e9e4;--orange:#d8873c;--red:#c75b55;--blue:#527fa5;--white:#fff;--shadow:0 10px 30px rgba(22,55,44,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{height:68px;background:var(--green);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1280px)/2));position:sticky;top:0;z-index:900}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.2px}.brandmark{width:37px;height:37px;border-radius:12px;background:#d8eee1;color:var(--green);display:grid;place-items:center;font-size:20px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;font-weight:600;color:#b9d2c7}.top-actions{display:flex;align-items:center;gap:10px}.demo-tag{font-size:11px;background:#ffffff1c;border:1px solid #ffffff38;padding:7px 10px;border-radius:20px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;font-size:13px;transition:.18s}.btn-primary{background:var(--green2);color:white}.btn-primary:hover{background:#174e43}.btn-light{background:white;color:var(--green);border:1px solid var(--line)}.btn-outline{background:transparent;color:var(--green);border:1px solid #b9ccc2}.btn-danger{background:#fff0ef;color:#a8413c}.btn-small{padding:7px 10px;font-size:12px}.wrap{max-width:1280px;margin:auto;padding:26px 22px 60px}.hero{background:linear-gradient(120deg,#123c35,#1e6957);color:white;border-radius:22px;padding:34px 36px;display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:center;box-shadow:var(--shadow)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:#b8d8c9;font-weight:800}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.08;margin:12px 0}.hero p{color:#d8e8e0;line-height:1.65;max-width:650px;font-size:14px}.hero-side{background:#ffffff12;border:1px solid #ffffff28;border-radius:17px;padding:20px}.hero-side strong{font-size:14px}.hero-side p{font-size:12px;margin:8px 0 14px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hero .btn-light{border:0}.hero .btn-outline{color:white;border-color:#ffffff66}.demo-notice{margin:16px 0;padding:11px 14px;background:#fff8e9;border:1px solid #f0dfb9;border-radius:11px;color:#735b31;font-size:12px;line-height:1.5}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:28px 0 14px}.section-head h2{font-size:20px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.rolebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:white;border:1px solid var(--line);padding:12px 14px;border-radius:15px;box-shadow:var(--shadow);margin:18px 0}.role-tabs{display:flex;gap:7px;flex-wrap:wrap}.role-tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;font-size:12px;font-weight:750;color:#53645d}.role-tab.active{background:var(--green);border-color:var(--green);color:white}.role-caption{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.metric{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.metric-icon{width:31px;height:31px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:var(--green2);font-size:16px}.metric strong{display:block;font-size:29px;margin:11px 0 3px}.metric small{font-size:11px;color:var(--muted)}.grid-main{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel-title h3{font-size:15px;margin:0}.panel-title span{font-size:11px;color:var(--muted)}#map{height:355px;border-radius:12px;z-index:1;background:#e9efeb}.map-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.chart-box{height:180px;position:relative}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#52645c}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;padding:10px 11px;border:1px solid #dce6df;border-radius:9px;background:#fbfcfb;color:var(--ink);font-size:13px;outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#68a58b;box-shadow:0 0 0 3px #dff0e6}.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}.filters input{flex:1;min-width:140px}.filters select{width:auto;min-width:125px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:650px}th{text-align:left;color:#75847d;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:10px 9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid #edf1ee;vertical-align:middle}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800;background:#edf2ee;color:#53635b}.pill.pending{background:#fff2dc;color:#946323}.pill.verified,.pill.completed{background:#e2f3e9;color:#286847}.pill.rejected{background:#fdebea;color:#a74642}.pill.high{background:#fdebea;color:#a74642}.pill.medium{background:#fff2dc;color:#946323}.pill.low{background:#e7f1fb;color:#426c93}.empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}.list{display:flex;flex-direction:column;gap:9px}.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px}.list-item strong{font-size:12px}.list-item small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.list-actions{display:flex;gap:6px;flex-wrap:wrap}.activity{border-left:2px solid #c9ded2;margin-left:6px;padding-left:15px;display:flex;flex-direction:column;gap:13px}.activity-item{position:relative}.activity-item:before{content:"";position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:#4f9678;border:2px solid white;box-shadow:0 0 0 1px #c9ded2}.activity-item strong{font-size:12px}.activity-item small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.role-panel{display:none}.role-panel.active{display:block}.footer{margin-top:28px;text-align:center;color:#85938c;font-size:11px;line-height:1.6}.toast{position:fixed;right:18px;bottom:18px;background:#163f36;color:white;padding:12px 16px;border-radius:11px;font-size:12px;box-shadow:var(--shadow);z-index:2000;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.small-muted{font-size:10px;color:var(--muted)}.unmet-row{padding:12px;border:1px solid #f0e2c7;background:#fffcf6;border-radius:11px}.unmet-row strong{font-size:12px}.unmet-row p{font-size:11px;color:#786b54;margin:5px 0}.barline{height:7px;border-radius:9px;background:#edf1ee;overflow:hidden;margin-top:8px}.barline i{display:block;height:100%;background:#d18b45;border-radius:9px}.hidden{display:none!important}
@media(max-width:850px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.grid-main,.content-grid{grid-template-columns:1fr}.chart-grid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.topbar{height:60px;padding:0 14px}.top-actions .demo-tag{display:none}.wrap{padding:15px 12px 40px}.hero{padding:24px 20px;border-radius:16px}.hero h1{font-size:29px}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:24px}.metric-top{font-size:10px}.rolebar{align-items:flex-start}.role-caption{width:100%}.role-tabs{width:100%}.role-tab{flex:1;padding:9px 7px;font-size:11px}.panel{padding:14px}.chart-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}#map{height:300px}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<script>
const DEMO_KEY='pahunchLedgerOneClickDemoV1';
const seed={
 reports:[
  {id:'PL-1001',village:'Demo Village',district:'Mandi',category:'Water supply',urgency:'High',affected:50,details:'Sample report: water access disruption reported by a community volunteer.',reporter:'Community volunteer',status:'Pending',created:'Today, 10:15 AM',lat:31.5892,lng:76.9182},
  {id:'PL-1002',village:'Hillview Hamlet',district:'Kullu',category:'Road access',urgency:'High',affected:32,details:'Sample report: access route needs assessment after heavy rainfall.',reporter:'Local resident',status:'Verified',created:'Today, 9:40 AM',lat:31.9579,lng:77.1095},
  {id:'PL-1003',village:'Pine Ridge',district:'Shimla',category:'Essential supplies',urgency:'Medium',affected:24,details:'Sample report: essential supply coordination requested.',reporter:'Student volunteer',status:'Verified',created:'Yesterday, 4:20 PM',lat:31.1048,lng:77.1734},
  {id:'PL-1004',village:'Riverbend',district:'Kangra',category:'Power supply',urgency:'Low',affected:18,details:'Sample report: power supply update requested.',reporter:'Community volunteer',status:'Unable to verify',created:'Yesterday, 1:05 PM',lat:32.0998,lng:76.2691},
  {id:'PL-1005',village:'Upper Meadow',district:'Chamba',category:'Medical assistance',urgency:'High',affected:12,details:'Sample report: request for coordination of medical assistance. No personal details included.',reporter:'Local volunteer',status:'Pending',created:'Today, 8:30 AM',lat:32.5534,lng:76.1258}
 ],
 assistance:[
  {id:'AS-201',reportId:'PL-1003',type:'Essential supplies coordination',people:16,status:'In progress',notes:'Sample coordination update: supplies handover recorded in demo.',created:'Yesterday, 5:10 PM'},
  {id:'AS-202',reportId:'PL-1002',type:'Road access update',people:10,status:'Completed',notes:'Sample update recorded for demonstration.',created:'Today, 11:00 AM'}
 ],
 activity:[
  {title:'Demo workspace opened',detail:'Sample records loaded for presentation',time:'Just now'},
  {title:'Assistance update recorded',detail:'PL-1002 · Sample coordination entry',time:'Today, 11:00 AM'},
  {title:'Report marked verified',detail:'PL-1003 · Reviewer demo action',time:'Yesterday, 4:45 PM'}
 ]
};
let state=loadState(),currentRole='reporter',map=null,markerLayer=null,charts={};
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const s=JSON.parse(localStorage.getItem(DEMO_KEY));if(s&&Array.isArray(s.reports)&&Array.isArray(s.assistance)&&Array.isArray(s.activity))return s}catch(e){}return clone(seed)}
function saveState(){localStorage.setItem(DEMO_KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function addActivity(title,detail){state.activity.unshift({title,detail,time:new Date().toLocaleString()});state.activity=state.activity.slice(0,20)}
function switchRole(role){currentRole=role;document.querySelectorAll('.role-tab').forEach(b=>b.classList.toggle('active',b.dataset.role===role));document.querySelectorAll('.role-panel').forEach(p=>p.classList.remove('active'));document.getElementById(role+'Panel').classList.add('active');const captions={reporter:'Reporter view · Submit a community needs report.',reviewer:'Reviewer view · Review reports and record a decision.',coordinator:'Coordinator view · Record assistance and track updates.'};document.getElementById('roleCaption').textContent=captions[role];if(role==='reviewer')renderReviewQueue();if(role==='coordinator'){renderAssistance();populateAssistSelect()}setTimeout(()=>{if(map)map.invalidateSize()},150)}
function updateMetrics(){const total=state.reports.length,verified=state.reports.filter(r=>r.status==='Verified').length,pending=state.reports.filter(r=>r.status==='Pending').length,assisted=state.assistance.reduce((n,a)=>n+(Number(a.people)||0),0);document.getElementById('mTotal').textContent=total;document.getElementById('mVerified').textContent=verified;document.getElementById('mPending').textContent=pending;document.getElementById('mAssisted').textContent=assisted.toLocaleString('en-IN')}
function pillStatus(s){let cls=s==='Verified'?'verified':s==='Completed'?'completed':s==='Unable to verify'?'rejected':'pending';return `<span class="pill ${cls}">${esc(s)}</span>`}
function pillUrgency(s){return `<span class="pill ${s.toLowerCase()}">${esc(s)}</span>`}
function renderReports(){const q=document.getElementById('searchReports').value.toLowerCase(),sf=document.getElementById('statusFilter').value,uf=document.getElementById('urgencyFilter').value;const rows=state.reports.filter(r=>(sf==='All'||r.status===sf)&&(uf==='All'||r.urgency===uf)&&[r.id,r.village,r.district,r.category].join(' ').toLowerCase().includes(q));document.getElementById('reportRows').innerHTML=rows.length?rows.map(r=>`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.village)}<br><span class="small-muted">${esc(r.district)}</span></td><td>${esc(r.category)}</td><td>${pillUrgency(r.urgency)}</td><td>${Number(r.affected).toLocaleString('en-IN')}</td><td>${pillStatus(r.status)}</td><td>${esc(r.created)}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">No matching reports found.</td></tr>`}
function renderReviewQueue(){const pending=state.reports.filter(r=>r.status==='Pending');document.getElementById('reviewQueue').innerHTML=pending.length?pending.map(r=>`<div class="list-item"><div><strong>${esc(r.id)} · ${esc(r.village)}</strong><small>${esc(r.category)} · ${esc(r.district)} · ${r.affected} people reported</small><small>${esc(r.details)}</small></div><div class="list-actions"><button class="btn btn-primary btn-small" onclick="reviewReport('${r.id}','Verified')">Verify</button><button class="btn btn-danger btn-small" onclick="reviewReport('${r.id}','Unable to verify')">Needs check</button></div></div>`).join(''):'<div class="empty">No pending reports. Submit a report in Reporter view to try the review flow.</div>'}
function reviewReport(id,status){const r=state.reports.find(x=>x.id===id);if(!r)return;r.status=status;addActivity('Report review updated',`${id} · Marked ${status} in demo`);saveState();refreshAll();renderReviewQueue();showToast(`${id} marked ${status}.`)}
function populateAssistSelect(){const s=document.getElementById('assistReport');const opts=state.reports.filter(r=>r.status==='Verified');s.innerHTML=opts.length?opts.map(r=>`<option value="${r.id}">${esc(r.id)} · ${esc(r.village)} — ${esc(r.category)}</option>`).join(''):'<option value="">No verified reports yet — verify a report first</option>'}
function renderAssistance(){const el=document.getElementById('assistanceList');el.innerHTML=state.assistance.length?state.assistance.map(a=>{const r=state.reports.find(x=>x.id===a.reportId);return `<div class="list-item"><div><strong>${esc(a.type)}</strong><small>${esc(a.reportId)} · ${esc(r?r.village:'Area unavailable')} · ${a.people} people recorded</small><small>${esc(a.notes||'No note added')}</small></div>${pillStatus(a.status)}</div>`}).join(''):'<div class="empty">No assistance updates have been recorded yet.</div>'}
function renderUnmet(){const list=state.reports.filter(r=>r.status==='Verified'&&!state.assistance.some(a=>a.reportId===r.id&&a.status==='Completed'));document.getElementById('unmetList').innerHTML=list.length?list.map(r=>{const logged=state.assistance.filter(a=>a.reportId===r.id).reduce((n,a)=>n+Number(a.people||0),0);return `<div class="unmet-row"><strong>${esc(r.village)} · ${esc(r.category)}</strong><p>${esc(r.district)} · ${r.affected} people reported · ${logged?logged+' people in assistance records':'No completed assistance record yet'}</p><div class="barline"><i style="width:${Math.min(100,Math.round(logged/Math.max(1,r.affected)*100))}%"></i></div></div>`}).join(''):'<div class="empty">No verified reports are currently flagged by this simple demo rule.</div>'}
function renderActivity(){document.getElementById('activityLog').innerHTML=state.activity.slice(0,8).map(a=>`<div class="activity-item"><strong>${esc(a.title)}</strong><small>${esc(a.detail)} · ${esc(a.time)}</small></div>`).join('')}
function initMap(){if(!window.L){document.getElementById('map').innerHTML='<div class="empty">Map library could not load. Check your internet connection and refresh the page.</div>';return}map=L.map('map').setView([31.75,76.95],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);markerLayer=L.layerGroup().addTo(map);renderMap()}
function renderMap(){if(!map||!markerLayer)return;markerLayer.clearLayers();const colors={High:'#d45e52',Medium:'#d69a45',Low:'#5488ad'};state.reports.forEach(r=>{if(typeof r.lat!=='number'||typeof r.lng!=='number')return;const m=L.circleMarker([r.lat,r.lng],{radius:9,color:'#fff',weight:2,fillColor:colors[r.urgency]||'#5488ad',fillOpacity:.95}).addTo(markerLayer);m.bindPopup(`<b>${esc(r.village)}</b><br>${esc(r.district)}<br>${esc(r.category)} · ${esc(r.urgency)}<br>Status: ${esc(r.status)}<br><small>Illustrative demo location</small>`)});const coords=state.assistance.map(a=>state.reports.find(r=>r.id===a.reportId)).filter(r=>r&&typeof r.lat==='number');coords.forEach(r=>L.marker([r.lat+.012,r.lng+.012]).addTo(markerLayer).bindPopup(`<b>Assistance record</b><br>${esc(r.village)}<br><small>Illustrative demo marker</small>`))}
function makeCharts(){if(!window.Chart)return;Chart.defaults.font.family='Inter, system-ui, sans-serif';Chart.defaults.font.size=10;const common={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:9,usePointStyle:true,padding:12}}}};const create=(id,type,data,opts={})=>{const c=document.getElementById(id);if(!c)return;if(charts[id])charts[id].destroy();charts[id]=new Chart(c,{type,data,options:{...common,...opts}})};const count=s=>state.reports.filter(r=>r.status===s).length;create('statusChart','doughnut',{labels:['Pending','Verified','Unable to verify'],datasets:[{data:[count('Pending'),count('Verified'),count('Unable to verify')],backgroundColor:['#d69a45','#4c9873','#c76a63'],borderWidth:0}]},{cutout:'66%'});const cats=['Water supply','Essential supplies','Medical assistance','Road access','Shelter','Power supply','Other'];create('categoryChart','bar',{labels:cats,datasets:[{label:'Reports',data:cats.map(c=>state.reports.filter(r=>r.category===c).length),backgroundColor:'#5d9a7b',borderRadius:5}]},{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}});const total=state.reports.reduce((n,r)=>n+Number(r.affected||0),0),ass=state.assistance.reduce((n,a)=>n+Number(a.people||0),0);create('assistanceChart','bar',{labels:['People reported affected','People in assistance records'],datasets:[{data:[total,ass],backgroundColor:['#d8a45c','#5a9879'],borderRadius:6}]},{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}});create('urgencyChart','doughnut',{labels:['High','Medium','Low'],datasets:[{data:['High','Medium','Low'].map(u=>state.reports.filter(r=>r.urgency===u).length),backgroundColor:['#c9675e','#d6a04d','#6691b4'],borderWidth:0}]},{cutout:'58%'})}
function refreshAll(){updateMetrics();renderReports();renderReviewQueue();renderAssistance();populateAssistSelect();renderUnmet();renderActivity();renderMap();makeCharts()}
document.getElementById('reportForm').addEventListener('submit',e=>{e.preventDefault();const village=document.getElementById('village').value.trim(),district=document.getElementById('district').value.trim(),affected=Number(document.getElementById('affected').value),details=document.getElementById('details').value.trim();if(!village||!district||!details||!Number.isInteger(affected)||affected<1){showToast('Please complete the required fields.');return}const id='PL-'+(1006+state.reports.length);state.reports.unshift({id,village,district,category:document.getElementById('category').value,urgency:document.getElementById('urgency').value,affected,details,reporter:document.getElementById('reporterName').value.trim()||'Demo reporter',status:'Pending',created:new Date().toLocaleString(),lat:null,lng:null});addActivity('New report submitted',`${id} · ${village}, ${district} · Waiting for review`);saveState();e.target.reset();refreshAll();showToast('Report submitted. Switch to Reviewer to review it.')});
document.getElementById('assistanceForm').addEventListener('submit',e=>{e.preventDefault();const reportId=document.getElementById('assistReport').value,people=Number(document.getElementById('assistPeople').value);if(!reportId){showToast('Verify a report before adding assistance.');return}if(!Number.isInteger(people)||people<0){showToast('Enter a valid number.');return}const type=document.getElementById('assistType').value,notes=document.getElementById('assistNotes').value.trim();state.assistance.unshift({id:'AS-'+(203+state.assistance.length),reportId,type,people,status:'Completed',notes:notes||'Sample assistance update recorded.',created:new Date().toLocaleString()});addActivity('Assistance update recorded',`${reportId} · ${type} · ${people} people recorded`);saveState();e.target.reset();refreshAll();showToast('Assistance update saved in this demo.')});
function exportCSV(){const headers=['Reference','Village or area','District','Need category','Urgency','People affected','Status','Reported'];const rows=state.reports.map(r=>[r.id,r.village,r.district,r.category,r.urgency,r.affected,r.status,r.created]);const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv=[headers,...rows].map(row=>row.map(safe).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pahunch-ledger-demo-reports.csv';a.click();URL.revokeObjectURL(url);showToast('CSV export prepared.')}
function resetDemo(){if(!confirm('Reset the demo to its original sample data?'))return;state=clone(seed);saveState();refreshAll();switchRole('reporter');showToast('Demo reset to sample data.')}
window.addEventListener('load',()=>{initMap();refreshAll();switchRole('reporter')});
</script>
</body>
</html>
